# Generated by the development repository's publishing tooling from the
# project's declared checks, which also gate every publish. Edit the checks
# there; a change made only here is overwritten by the next publish.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -e "./_shared/ha-mqtt-bridge-toolkit[yaml]"
          /tmp/venv/bin/pip install -q -e "./_shared/python-github-error-reporter"
          /tmp/venv/bin/pip install -q -e ".[dev]"
          /tmp/venv/bin/python -m pytest -q
