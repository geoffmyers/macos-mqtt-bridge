[project]
name = "python-github-error-reporter"
version = "0.1.0"
description = "Production error reporter for Python services — dispatches to GitHub via repository_dispatch."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_github_error_reporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
