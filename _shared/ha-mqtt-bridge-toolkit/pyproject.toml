[project]
name = "ha-mqtt-bridge-toolkit"
version = "0.6.0"
description = "Shared utilities for MQTT → Home Assistant bridges: HA Discovery payload builders, topic helpers, ISO-8601 time helpers, disk-backed JSONL outbox, threaded paho-mqtt v5 publisher, aiomqtt kwargs builder, YAML+env-var config loader, HTTP retry-with-backoff."
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
# Bridges that use the YAML+${ENV_VAR} config pattern (macOS) opt in
# to PyYAML via this extra. The aiomqtt-side bridges don't need it.
yaml = [
    "pyyaml>=6.0.1",
]
# Bridges that poll a cloud REST API (Govee, DroneMobile, Emporia Vue,
# Flume, Tractive) opt in to `requests` via this extra for
# `request_with_backoff`. The BMW/macOS/Find My bridges don't need it.
http = [
    "requests>=2.31.0",
]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ha_mqtt_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
